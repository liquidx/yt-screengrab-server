services:
  yt-screengrab-server:
    image: ghcr.io/liquidx/yt-screengrab-server:latest
    container_name: yt-screengrab-server
    restart: unless-stopped
    ports:
      - "7777:7777"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7777/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
